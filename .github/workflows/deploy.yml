name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test website and enquiry backend
        run: |
          python3 -m unittest discover -s tests -v
          node --test tests/contact.test.mjs tests/how-we-help-production.test.mjs
          node --check public/site.js
          node --check public/workshop.js
          node --check public/how-we-help.js
      - name: Deploy private enquiry mailer
        run: |
          node scripts/worker-config.mjs
          npx --yes wrangler@4 deploy --config backend/wrangler.generated.json
        env:
          CONTACT_TO: ${{{{ secrets.CONTACT_TO }}}}
          CLOUDFLARE_API_TOKEN: ${{{{ secrets.CLOUDFLARE_WORKERS_API_TOKEN }}}}
          CLOUDFLARE_ACCOUNT_ID: ${{{{ secrets.CLOUDFLARE_ACCOUNT_ID }}}}
      - name: Deploy to Cloudflare Pages
        run: npx --yes wrangler@4 pages deploy public --project-name jaxsystems-site --branch main
        env:
          CLOUDFLARE_API_TOKEN: ${{{{ secrets.CLOUDFLARE_API_TOKEN }}}}
          CLOUDFLARE_ACCOUNT_ID: ${{{{ secrets.CLOUDFLARE_ACCOUNT_ID }}}}
