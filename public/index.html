<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jax Systems — Coming soon</title>
<meta name="description" content="Jax Systems. Jacksonville, Florida. Our website is on the way.">
<meta name="color-scheme" content="light">
<link rel="canonical" href="https://jaxsystems.ai/">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231d4a3f'/%3E%3Cpath d='M40 16v22c0 7-4 11-11 11-6 0-10-3-11-9l7-2c1 3 2 4 4 4 2 0 3-1 3-4V16z' fill='%23c9f06b'/%3E%3C/svg%3E">
<meta property="og:title" content="Jax Systems">
<meta property="og:description" content="Jax Systems. Our website is on the way.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://jaxsystems.ai/">
<style>
  :root{
    --ink:#141715; --ink-2:#2c332e; --muted:#63706a;
    --paper:#f3f0e7; --card:#fffdf7; --line:#d9d7c9;
    --acid:#c9f06b; --moss:#1d4a3f; --clay:#b8562f; --sand:#e9e5d6;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--paper); color:var(--ink);
    font:400 17px/1.6 ui-sans-serif,-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; flex-direction:column;
  }
  a{color:var(--moss)}
  .wrap{width:100%; max-width:940px; margin:0 auto; padding:0 28px}
  header{padding:34px 0 0}
  .brand{display:flex; align-items:center; gap:12px; text-decoration:none; color:var(--ink)}
  .mark{width:38px; height:38px; border-radius:10px; background:var(--moss); display:grid; place-items:center; flex:0 0 auto}
  .mark span{font:700 20px/1 ui-sans-serif,sans-serif; color:var(--acid)}
  .brand b{font-weight:650; letter-spacing:-.01em; font-size:19px}
  main{flex:1 0 auto; padding:96px 0 88px}
  .eyebrow{
    font:500 12.5px/1 var(--mono); letter-spacing:.14em; text-transform:uppercase;
    color:var(--moss); background:rgba(29,74,63,.08); border:1px solid rgba(29,74,63,.16);
    display:inline-block; padding:8px 11px; border-radius:999px; margin:0 0 26px;
  }
  h1{
    font-size:clamp(34px,5.2vw,58px); line-height:1.06; letter-spacing:-.026em;
    font-weight:600; margin:0 0 24px; max-width:19ch;
  }
  h1 em{font-style:normal; color:var(--clay)}
  p.lead{font-size:clamp(17px,2vw,20px); color:var(--ink-2); max-width:60ch; margin:0 0 14px}
  p.sub{color:var(--muted); max-width:58ch; margin:0}
  .rule{height:1px; background:var(--line); margin:46px 0 34px; max-width:640px}
  .contact{display:flex; flex-wrap:wrap; align-items:center; gap:16px}
  .btn{
    display:inline-flex; align-items:center; gap:10px; text-decoration:none;
    background:var(--moss); color:#fffdf7; font-weight:550; font-size:16px;
    padding:14px 20px; border-radius:10px; transition:transform .12s ease, background .12s ease;
  }
  .btn:hover{background:#173c33; transform:translateY(-1px)}
  .meta{font:400 13.5px/1.5 var(--mono); color:var(--muted)}
  footer{padding:26px 0 40px; border-top:1px solid var(--line); color:var(--muted); font-size:13.5px}
  footer .wrap{display:flex; flex-wrap:wrap; gap:10px 22px; justify-content:space-between}
  @media (max-width:560px){ main{padding:64px 0 60px} .rule{margin:34px 0 28px} }
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="/" aria-label="Jax Systems home">
      <span class="mark" aria-hidden="true"><span>J</span></span>
      <b>Jax Systems</b>
    </a>
  </div>
</header>

<main>
  <div class="wrap">
    <p class="eyebrow">Jacksonville · NE Florida</p>
    <h1>Our website is <em>on the way</em>.</h1>
    <p class="lead">Jax Systems · Jacksonville, Florida.</p>
    <p class="sub">More soon.</p>
  </div>
</main>

<footer>
  <div class="wrap">
    <span>© <span id="y">2026</span> Jax Systems · Jacksonville, Florida</span>
    <span>jaxsystems.ai</span>
  </div>
</footer>
<script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>
